AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  DMARC Tally smoke test only — private, isolated bucket for temporary Rust
  Lambda bootstrap ZIPs. Not a production release or public artifact bucket.

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Project
          Value: dmarc-tally
        - Key: Purpose
          Value: isolated-smoke-test

  ArtifactBucketTlsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub '${ArtifactBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  ArtifactBucket:
    Description: Generated S3 bucket for the unpublicised Lambda ZIP.
    Value: !Ref ArtifactBucket
  ArtifactBucketArn:
    Value: !GetAtt ArtifactBucket.Arn
