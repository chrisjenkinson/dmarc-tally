name: Validate SES inbound receiving configuration

on:
  pull_request:
    paths:
      - '.github/workflows/ses-receiving.yml'
      - 'infra/ses-receiving.yaml'
      - 'tests/receiving/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ses-receiving-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check SES S3 action, scoped role and disabled activation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install cfn-lint==1.57.2
      - run: cfn-lint --regions ap-southeast-2 -t infra/ses-receiving.yaml
      - run: python -m unittest discover -s tests/receiving -p 'test_*.py'
