[package]
name = "tally-lambda"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tally-core = { path = "../tally-core" }
tally-aws = { path = "../tally-aws" }
tally-web = { path = "../tally-web" }
base64 = "0.22"
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
lambda_runtime = "1.4"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
aws-sdk-s3 = "1"
aws-sdk-sesv2 = "1"
aws-sdk-ses = "1"
aws-sdk-cloudwatch = "1"
aws-sdk-sns = "1"

[dev-dependencies]

