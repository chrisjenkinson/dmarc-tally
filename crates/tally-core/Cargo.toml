[package]
name = "tally-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
async-trait = "0.1"

roxmltree = "=0.21.1"
mailparse = "=0.18.0"
flate2 = "=1.1.10"
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

base64 = "=0.22.1"
